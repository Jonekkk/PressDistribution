<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title">Welcome</h3>
                        <p class="card-text">
                            Signed in as <strong th:text="${fullName}">Full Name</strong>
                        </p>
                        <p class="card-text">
                            Role: <span th:text="${displayRole}">Role</span>
                        </p>
                        <div th:if="${isAdministrator}" class="d-grid gap-2">
                            <a th:href="@{/admin/parishes}" class="btn btn-primary">Parishes</a>
                            <a th:href="@{/admin/users}" class="btn btn-primary">Users</a>
                            <a th:href="@{/admin/publications}" class="btn btn-primary">Publications</a>
                            <a th:href="@{/admin/issues}" class="btn btn-primary">Issues</a>
                            <a th:href="@{/records}" class="btn btn-primary">Records</a>
                            <a th:href="@{/reports/publications}" class="btn btn-primary">Publication report</a>
                            <a th:href="@{/reports/parishes}" class="btn btn-primary">Parish report</a>
                            <a th:href="@{/admin/records/bulk}" class="btn btn-primary">Bulk entry</a>
                        </div>
                        <div th:unless="${isAdministrator}" class="d-grid gap-2">
                            <a th:href="@{/issues}" class="btn btn-primary">Issues</a>
                            <a th:href="@{/records}" class="btn btn-primary">Records</a>
                            <a th:href="@{/reports/my-parish}" class="btn btn-primary">My parish report</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
