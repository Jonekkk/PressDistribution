<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Record - Press Distribution' : 'Create Record - Press Distribution'">Record Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h3 th:text="${isEdit} ? 'Edit Record' : 'Create Record'">Record Form</h3>

        <div class="row">
            <div class="col-md-6">
                <form th:object="${recordForm}" method="post"
                      th:action="${isEdit} ? @{/records/{id}/edit(id=${recordId})} : @{/records/new}">

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Parish</label>
                        <input type="text" class="form-control" disabled
                               th:value="${parishLocality} + ' - ' + ${parishName}">
                    </div>

                    <!-- Create mode: issue dropdown -->
                    <div class="mb-3" th:unless="${isEdit}">
                        <div th:if="${noIssuesAvailable}" class="alert alert-info">
                            No issues are available for a new record. Records already exist for all current issues.
                        </div>
                        <label for="issueId" class="form-label">Issue <span class="text-danger">*</span></label>
                        <select id="issueId" th:field="*{issueId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('issueId')} ? 'is-invalid'"
                                required>
                            <option value="">-- Select issue --</option>
                            <option th:each="issue : ${issues}"
                                    th:value="${issue.id}"
                                    th:text="${issue.publication.name} + ' #' + ${issue.issueNumber}">Issue</option>
                        </select>
                        <span th:if="${#fields.hasErrors('issueId')}" th:errors="*{issueId}" class="text-danger small"></span>
                    </div>

                    <!-- Edit mode: issue read-only -->
                    <div class="mb-3" th:if="${isEdit}">
                        <label class="form-label">Issue</label>
                        <input type="text" class="form-control" disabled
                               th:value="${issueName}">
                    </div>

                    <div class="mb-3">
                        <label for="deliveredCopies" class="form-label">Delivered copies <span class="text-danger">*</span></label>
                        <input type="number" id="deliveredCopies" th:field="*{deliveredCopies}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('deliveredCopies')} ? 'is-invalid'"
                               min="0" required>
                        <span th:if="${#fields.hasErrors('deliveredCopies')}" th:errors="*{deliveredCopies}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="returnedCopies" class="form-label">Returned copies <span class="text-danger">*</span></label>
                        <input type="number" id="returnedCopies" th:field="*{returnedCopies}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('returnedCopies')} ? 'is-invalid'"
                               min="0" required>
                        <span th:if="${#fields.hasErrors('returnedCopies')}" th:errors="*{returnedCopies}" class="text-danger small"></span>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/records}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
