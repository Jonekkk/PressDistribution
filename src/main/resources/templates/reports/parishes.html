<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parish Report - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h2>Parish Report</h2>

        <!-- Filter Form -->
        <form th:object="${filter}" method="get" th:action="@{/reports/parishes}" class="card p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="parishId" class="form-label">Parish <span class="text-danger">*</span></label>
                    <select id="parishId" class="form-select" th:field="*{parishId}">
                        <option value="">-- Select parish --</option>
                        <option th:each="parish : ${parishes}" th:value="${parish.id}" th:text="${parish.locality + ' - ' + parish.name}">Parish</option>
                    </select>
                    <div th:if="${#fields.hasErrors('parishId')}" class="text-danger small" th:errors="*{parishId}">Error</div>
                </div>
                <div class="col-md-3">
                    <label for="dateFrom" class="form-label">Date from</label>
                    <input type="date" id="dateFrom" class="form-control" th:field="*{dateFrom}">
                    <div th:if="${#fields.hasErrors('dateFrom')}" class="text-danger small" th:errors="*{dateFrom}">Error</div>
                </div>
                <div class="col-md-3">
                    <label for="dateTo" class="form-label">Date to</label>
                    <input type="date" id="dateTo" class="form-control" th:field="*{dateTo}">
                    <div th:if="${#fields.hasErrors('dateTo')}" class="text-danger small" th:errors="*{dateTo}">Error</div>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary">Apply Filters</button>
                </div>
            </div>
        </form>

        <!-- Export CSV Button (only when results are shown) -->
        <div th:if="${showResults}" class="mb-3">
            <a th:href="@{/reports/parishes/export(parishId=${filter.parishId}, dateFrom=${filter.dateFrom}, dateTo=${filter.dateTo})}"
               class="btn btn-success">Export CSV</a>
        </div>

        <!-- Results Table -->
        <div th:if="${showResults}" class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Publication</th>
                        <th>Issue</th>
                        <th>Issue date</th>
                        <th>Delivered copies</th>
                        <th>Returned copies</th>
                        <th>Sold copies</th>
                        <th>Unit price</th>
                        <th>Amount due</th>
                        <th>Paid amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${rows.isEmpty()}">
                        <td colspan="9" class="text-center text-muted">No records match the current filters</td>
                    </tr>
                    <tr th:each="row : ${rows.content}">
                        <td th:text="${row.publicationName}">Publication</td>
                        <td th:text="${row.issueNumber}">Issue</td>
                        <td th:text="${row.issueDate}">2024-01-01</td>
                        <td th:text="${row.deliveredCopies}">0</td>
                        <td th:text="${row.returnedCopies}">0</td>
                        <td th:text="${row.soldCopies}">0</td>
                        <td th:text="${#numbers.formatDecimal(row.unitPrice, 1, 2)}">0.00</td>
                        <td th:text="${#numbers.formatDecimal(row.amountDue, 1, 2)}">0.00</td>
                        <td th:text="${#numbers.formatDecimal(row.paidAmount, 1, 2)}">0.00</td>
                    </tr>
                </tbody>
                <tfoot th:if="${!rows.isEmpty()}">
                    <tr class="fw-bold">
                        <td>Totals</td>
                        <td></td>
                        <td></td>
                        <td th:text="${totals.totalDelivered}">0</td>
                        <td th:text="${totals.totalReturned}">0</td>
                        <td th:text="${totals.totalSold}">0</td>
                        <td></td>
                        <td th:text="${#numbers.formatDecimal(totals.totalAmountDue, 1, 2)}">0.00</td>
                        <td th:text="${#numbers.formatDecimal(totals.totalPaidAmount, 1, 2)}">0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Pagination -->
        <nav th:if="${showResults and rows.totalPages > 1}">
            <ul class="pagination">
                <li th:each="i : ${#numbers.sequence(0, rows.totalPages - 1)}"
                    class="page-item"
                    th:classappend="${i == rows.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/reports/parishes(page=${i}, parishId=${filter.parishId}, dateFrom=${filter.dateFrom}, dateTo=${filter.dateTo})}"
                       th:text="${i + 1}">1</a>
                </li>
            </ul>
        </nav>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
