<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit publication - Press Distribution' : 'Create publication - Press Distribution'">Publication Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h3 th:text="${editMode} ? 'Edit publication' : 'Create publication'">Publication Form</h3>

        <div class="row">
            <div class="col-md-6">
                <form th:object="${publicationForm}" method="post"
                      th:action="${editMode} ? @{/admin/publications/{id}(id=${publicationId})} : @{/admin/publications}">

                    <div class="mb-3">
                        <label for="name" class="form-label">Publication name *</label>
                        <input type="text" id="name" th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></span>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/admin/publications}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
