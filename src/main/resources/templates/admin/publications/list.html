<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h2>Publications</h2>

        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}">
            Success message
        </div>

        <div class="mb-3">
            <a th:href="@{/admin/publications/new}" class="btn btn-primary">Create publication</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Latest issue date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="publication : ${publications}">
                        <td th:text="${publication.name}">Publication name</td>
                        <td th:text="${publication.latestIssueDate != null ? publication.latestIssueDate : '—'}">—</td>
                        <td>
                            <a th:href="@{/admin/issues/new(publicationId=${publication.id})}" class="btn btn-sm btn-outline-success">Add new issue</a>
                            <a th:href="@{/admin/publications/{id}/edit(id=${publication.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a th:href="@{/admin/publications/{id}/delete(id=${publication.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
