<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk entry - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h3>Bulk entry</h3>

        <!-- Flash success message -->
        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}">
            Success message
        </div>

        <!-- Global error alert -->
        <div th:if="${globalError}" class="alert alert-danger" role="alert" th:text="${globalError}">
            Global error
        </div>

        <!-- State 1: Issue selection form (when no valid issue selected) -->
        <div th:if="${selectedIssue == null}">
            <div class="row">
                <div class="col-md-6">
                    <form method="get" action="/admin/records/bulk">
                        <div class="mb-3">
                            <label for="issueId" class="form-label">Select issue</label>
                            <select id="issueId" name="issueId"
                                    class="form-select"
                                    th:classappend="${issueError} ? 'is-invalid'">
                                <option value="">-- Select issue --</option>
                                <option th:each="issue : ${issues}"
                                        th:value="${issue.id}"
                                        th:text="${issue.publication.name + ' - ' + issue.issueNumber + ' (' + issue.publicationDate + ', ' + #numbers.formatDecimal(issue.unitPrice, 1, 2) + ')'}">Issue</option>
                            </select>
                            <span th:if="${issueError}" class="text-danger small" th:text="${issueError}"></span>
                        </div>
                        <button type="submit" class="btn btn-primary">Load</button>
                        <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>

        <!-- State 2: Bulk entry table (when valid issue selected) -->
        <div th:if="${selectedIssue != null}">
            <!-- Issue details -->
            <div class="card mb-3">
                <div class="card-body">
                    <p class="mb-1"><strong>Publication:</strong> <span th:text="${selectedIssue.publication.name}">Publication</span></p>
                    <p class="mb-1"><strong>Issue number:</strong> <span th:text="${selectedIssue.issueNumber}">Number</span></p>
                    <p class="mb-0"><strong>Unit price:</strong> <span th:text="${#numbers.formatDecimal(selectedIssue.unitPrice, 1, 2)}">0.00</span></p>
                </div>
            </div>

            <!-- Change issue link -->
            <div class="mb-3">
                <a th:href="@{/admin/records/bulk}" class="btn btn-outline-secondary btn-sm">Change issue</a>
            </div>

            <!-- Bulk entry form -->
            <form method="post" th:action="@{/admin/records/bulk}">
                <input type="hidden" name="issueId" th:value="${issueId}">

                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Parish locality</th>
                                <th>Parish name</th>
                                <th>Delivered copies</th>
                                <th>Returned copies</th>
                                <th>Paid amount</th>
                                <th>Sold copies</th>
                                <th>Amount due</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row, rowStat : ${rows}">
                                <td>
                                    <input type="hidden" th:name="${'rows[' + rowStat.index + '].parishId'}" th:value="${row.parishId}">
                                    <span th:text="${row.parishLocality}">Locality</span>
                                </td>
                                <td th:text="${row.parishName}">Name</td>
                                <td>
                                    <input type="number" min="0" class="form-control form-control-sm"
                                           th:name="${'rows[' + rowStat.index + '].deliveredCopies'}"
                                           th:value="${row.deliveredCopies}"
                                           th:classappend="${row.deliveredError} ? 'is-invalid'">
                                    <span th:if="${row.deliveredError}" class="text-danger small" th:text="${row.deliveredError}"></span>
                                </td>
                                <td>
                                    <input type="number" min="0" class="form-control form-control-sm"
                                           th:name="${'rows[' + rowStat.index + '].returnedCopies'}"
                                           th:value="${row.returnedCopies}"
                                           th:classappend="${row.returnedError} ? 'is-invalid'">
                                    <span th:if="${row.returnedError}" class="text-danger small" th:text="${row.returnedError}"></span>
                                </td>
                                <td>
                                    <input type="number" step="0.01" min="0" class="form-control form-control-sm"
                                           th:name="${'rows[' + rowStat.index + '].paidAmount'}"
                                           th:value="${row.paidAmount != null ? #numbers.formatDecimal(row.paidAmount, 1, 2) : ''}"
                                           th:classappend="${row.paidAmountError} ? 'is-invalid'">
                                    <span th:if="${row.paidAmountError}" class="text-danger small" th:text="${row.paidAmountError}"></span>
                                </td>
                                <td th:text="${row.soldCopies}">0</td>
                                <td th:text="${#numbers.formatDecimal(row.amountDue, 1, 2)}">0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Save all</button>
                    <a th:href="@{/admin/records/bulk}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
