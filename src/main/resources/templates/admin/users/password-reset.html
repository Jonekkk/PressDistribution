<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h2>Reset Password</h2>

        <p class="mb-3">Reset password for: <strong th:text="${targetUserName}">Full Name</strong> (<span th:text="${targetUserEmail}">email@example.com</span>)</p>

        <form th:action="@{/admin/users/{id}/password-reset(id=${userId})}" method="post" th:object="${passwordForm}">
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                           th:value="${passwordForm.password}"
                           th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}">
                    <button type="button" class="btn btn-outline-secondary" id="togglePassword">Show password</button>
                </div>
                <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1" th:errors="*{password}">
                    Password error
                </div>
            </div>

            <div class="mb-3">
                <button type="submit"
                        th:formaction="@{/admin/users/{id}/password-reset/generate-password(id=${userId})}"
                        formmethod="post"
                        formnovalidate
                        class="btn btn-outline-primary btn-sm">Generate Password</button>
            </div>

            <p class="text-muted small mb-3">This will also generate a new recovery code.</p>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Reset Password</button>
                <a th:href="@{/admin/users/{id}/edit(id=${userId})}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        var field = document.getElementById('password');
        field.type = field.type === 'password' ? 'text' : 'password';
        this.textContent = field.type === 'password' ? 'Show password' : 'Hide password';
    });
    </script>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
