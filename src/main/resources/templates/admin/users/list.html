<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h2>Users</h2>

        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}">
            Success message
        </div>

        <div class="mb-3">
            <a th:href="@{/admin/users/new}" class="btn btn-primary">Create user</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Parish</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users.content}">
                        <td th:text="${user.fullName()}">Full Name</td>
                        <td th:text="${user.email()}">Email</td>
                        <td>
                            <span th:if="${user.phoneNumber() != null}" th:text="${user.phoneNumber()}">Phone</span>
                            <span th:if="${user.phoneNumber() == null}">&mdash;</span>
                        </td>
                        <td th:text="${user.role()}">Role</td>
                        <td>
                            <span th:if="${user.parishName() != null}" th:text="${user.parishName()}">Parish</span>
                            <span th:if="${user.parishName() == null}">&mdash;</span>
                        </td>
                        <td th:text="${user.active() ? 'Yes' : 'No'}">Active</td>
                        <td>
                            <a th:href="@{/admin/users/{id}/edit(id=${user.id()})}">Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${users.totalPages > 1}" aria-label="User list pagination">
            <ul class="pagination">
                <li class="page-item" th:classappend="${users.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/users(page=${users.number - 1})}">Previous</a>
                </li>
                <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, users.totalPages - 1)}"
                    th:classappend="${pageNum == users.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/admin/users(page=${pageNum})}" th:text="${pageNum + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${users.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/users(page=${users.number + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
