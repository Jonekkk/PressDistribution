<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h2>Credentials</h2>

        <div class="alert alert-warning" role="alert">
            Save these credentials now. They will not be shown again.
        </div>

        <div class="card">
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-3">Full Name</dt>
                    <dd class="col-sm-9" th:text="${fullName}">John Doe</dd>

                    <dt class="col-sm-3">Email</dt>
                    <dd class="col-sm-9" th:text="${email}">john@example.com</dd>

                    <dt class="col-sm-3" th:if="${showPassword}">Password</dt>
                    <dd class="col-sm-9" th:if="${showPassword}" th:text="${password}">generated-password</dd>

                    <dt class="col-sm-3">Recovery Code</dt>
                    <dd class="col-sm-9" th:text="${recoveryCode}">XXXX-XXXX-XXXX-XXXX</dd>
                </dl>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/admin/users}" class="btn btn-primary">Back to Users</a>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
