<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit issue - Press Distribution' : 'Create issue - Press Distribution'">Issue Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h3 th:text="${editMode} ? 'Edit issue' : 'Create issue'">Issue Form</h3>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
            Error message
        </div>

        <div class="row">
            <div class="col-md-6">
                <form th:object="${issueForm}" method="post"
                      th:action="${editMode} ? @{/admin/issues/{id}(id=${issueId})} : @{/admin/issues}">

                    <div class="mb-3">
                        <label for="publicationId" class="form-label">Publication *</label>
                        <select id="publicationId" th:field="*{publicationId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('publicationId')} ? 'is-invalid'">
                            <option value="">-- Select publication --</option>
                            <option th:each="pub : ${publications}"
                                    th:value="${pub.id}"
                                    th:text="${pub.name}">Publication</option>
                        </select>
                        <span th:if="${#fields.hasErrors('publicationId')}" th:errors="*{publicationId}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="issueNumber" class="form-label">Issue number *</label>
                        <input type="text" id="issueNumber" th:field="*{issueNumber}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('issueNumber')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('issueNumber')}" th:errors="*{issueNumber}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="publicationDate" class="form-label">Publication date *</label>
                        <input type="date" id="publicationDate" th:field="*{publicationDate}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('publicationDate')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('publicationDate')}" th:errors="*{publicationDate}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="unitPrice" class="form-label">Unit price *</label>
                        <input type="number" step="0.01" id="unitPrice" th:field="*{unitPrice}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}" class="text-danger small"></span>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/admin/issues}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:if="${!editMode}" th:inline="javascript">
    (function() {
        var publicationSelect = document.getElementById('publicationId');
        var unitPriceInput = document.getElementById('unitPrice');
        // Track the last auto-populated price so we know if user edited it manually
        var lastAutoPrice = /*[[${issueForm.unitPrice}]]*/ null;
        // Convert to string for comparison (server renders as e.g. "4.50")
        lastAutoPrice = lastAutoPrice != null ? String(lastAutoPrice) : '';

        publicationSelect.addEventListener('change', function() {
            var pubId = this.value;
            if (!pubId) return;

            var currentValue = unitPriceInput.value.trim();
            // Only auto-fill if the field is empty or contains the previous auto-populated value
            var isAutoOrEmpty = (currentValue === '' || currentValue === lastAutoPrice);

            fetch(/*[[@{/issues/defaults}]]*/ '/issues/defaults' + '?publicationId=' + encodeURIComponent(pubId), {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            })
            .then(function(response) {
                if (!response.ok) return null;
                return response.json();
            })
            .then(function(data) {
                if (data === null) return;
                if (isAutoOrEmpty) {
                    if (data.unitPrice != null) {
                        unitPriceInput.value = data.unitPrice;
                        lastAutoPrice = String(data.unitPrice);
                    } else {
                        // No prior issues — clear only if it was auto-populated
                        unitPriceInput.value = '';
                        lastAutoPrice = '';
                    }
                }
            })
            .catch(function() { /* silently ignore network errors */ });
        });
    })();
    </script>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
