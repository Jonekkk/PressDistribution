<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete issue - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <nav class="mb-3">
            <a th:href="@{/admin/issues}" class="btn btn-outline-secondary btn-sm">Back to Issues</a>
        </nav>
        <h3>Delete issue</h3>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
            Error message
        </div>

        <div class="card">
            <div class="card-body">
                <p>Are you sure you want to permanently delete the issue <strong th:text="${issue.publication.name + ' - ' + issue.issueNumber}">Publication - Issue Number</strong>?</p>
                <p class="text-danger">This action cannot be undone.</p>
                <form th:action="@{/admin/issues/{id}/delete(id=${issue.id})}" method="post">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a th:href="@{/admin/issues}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
