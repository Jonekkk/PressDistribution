<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit parish - Press Distribution' : 'Create parish - Press Distribution'">Parish Form - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h3 th:text="${editMode} ? 'Edit parish' : 'Create parish'">Parish Form</h3>

        <div class="row">
            <div class="col-md-6">
                <form th:object="${parishForm}" method="post"
                      th:action="${editMode} ? @{/admin/parishes/{id}(id=${parishId})} : @{/admin/parishes}">

                    <div class="mb-3">
                        <label for="locality" class="form-label">Locality *</label>
                        <input type="text" id="locality" th:field="*{locality}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('locality')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('locality')}" th:errors="*{locality}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Parish name *</label>
                        <input type="text" id="name" th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea id="address" th:field="*{address}" rows="3"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                        <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger small"></span>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/admin/parishes}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
