<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Password Reset Successful</h3>

                        <div class="alert alert-success">
                            Your password has been changed. You can now sign in with your new password.
                        </div>

                        <div class="alert alert-warning">
                            <strong>Important:</strong> Your new recovery code is shown below. Save it now — it will not be displayed again.
                        </div>

                        <div class="text-center mb-4">
                            <p class="card-text fs-4 font-monospace" th:text="${recoveryCode}">XXXX-XXXX-XXXX-XXXX</p>
                        </div>

                        <div class="text-center">
                            <a th:href="@{/login}" class="btn btn-primary">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
