<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Reset Password</h3>
                        <p class="text-muted text-center mb-4">Enter your email address and recovery code to set a new password.</p>

                        <div th:if="${recoveryError}" class="alert alert-danger" role="alert"
                             th:text="${recoveryError}">Error message</div>

                        <form th:action="@{/login/recovery}" method="post" th:object="${recoveryLoginForm}">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">Email error</div>
                            </div>
                            <div class="mb-3">
                                <label for="recoveryCode" class="form-label">Recovery code</label>
                                <input type="text" class="form-control font-monospace" id="recoveryCode"
                                       th:field="*{recoveryCode}" placeholder="XXXX-XXXX-XXXX-XXXX"
                                       th:classappend="${#fields.hasErrors('recoveryCode')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('recoveryCode')}"
                                     th:errors="*{recoveryCode}">Recovery code error</div>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New password</label>
                                <input type="password" class="form-control" id="newPassword"
                                       th:field="*{newPassword}"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                     th:errors="*{newPassword}">Password error</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm new password</label>
                                <input type="password" class="form-control" id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                     th:errors="*{confirmPassword}">Confirm error</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}">Back to Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
