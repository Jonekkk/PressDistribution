<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-sm navbar-light bg-white shadow-sm mb-3">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Press Distribution</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" th:if="${navIsAdministrator}">
                    <a class="nav-link" th:href="@{/admin/publications}">Publications</a>
                </li>
                <li class="nav-item" th:if="${navIsAdministrator}">
                    <a class="nav-link" th:href="@{/admin/parishes}">Parishes</a>
                </li>
                <li class="nav-item" th:if="${navIsAdministrator}">
                    <a class="nav-link" th:href="@{/admin/users}">Users</a>
                </li>
                <li class="nav-item" th:if="${navIsAdministrator}">
                    <a class="nav-link" th:href="@{/reports/parishes}">Parish report</a>
                </li>
                <li class="nav-item" th:if="${navIsParishPriest}">
                    <a class="nav-link" th:href="@{/reports/my-parish}">Parish report</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">My profile</a>
                <form th:action="@{/logout}" method="post" class="d-inline mb-0">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Sign Out</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
