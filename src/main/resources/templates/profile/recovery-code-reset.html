<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Recovery Code - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mt-4">
        <h2>Reset Recovery Code</h2>

        <div class="alert alert-warning" role="alert">
            Generating a new recovery code will permanently replace your current code. Make sure you save the new code in a safe place.
        </div>

        <div th:if="${globalError}" class="alert alert-danger" role="alert" th:text="${globalError}">
            Global error message
        </div>

        <div th:if="${currentPasswordError}" class="alert alert-danger" role="alert" th:text="${currentPasswordError}">
            Current password error
        </div>

        <form th:object="${recoveryCodeResetForm}" th:action="@{/profile/recovery-code-reset}" method="post">
            <div class="mb-3">
                <label for="currentPassword" class="form-label">Current Password</label>
                <input type="password" class="form-control" id="currentPassword"
                       th:field="*{currentPassword}"
                       th:classappend="${#fields.hasErrors('currentPassword') ? 'is-invalid' : ''}">
                <div th:if="${#fields.hasErrors('currentPassword')}" class="invalid-feedback" th:errors="*{currentPassword}">
                    Validation error
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">Reset Recovery Code</button>
                <a th:href="@{/profile}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
