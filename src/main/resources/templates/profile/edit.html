<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container mt-4">
        <h2>Edit Profile</h2>

        <div class="row">
            <div class="col-md-6">
                <form th:object="${profileEditForm}" method="post" th:action="@{/profile/edit}">

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                    </div>

                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full name *</label>
                        <input type="text" id="fullName" th:field="*{fullName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="text" id="email" th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone number</label>
                        <input type="text" id="phoneNumber" th:field="*{phoneNumber}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-danger small"></span>
                    </div>

                    <hr class="my-4">

                    <dl class="row mb-3">
                        <dt class="col-sm-4">Role</dt>
                        <dd class="col-sm-8" th:text="${roleName}">Administrator</dd>

                        <dt class="col-sm-4" th:if="${parishDisplay != null}">Parish</dt>
                        <dd class="col-sm-8" th:if="${parishDisplay != null}"
                            th:text="${parishDisplay}">Parish Name</dd>

                        <dt class="col-sm-4">Active</dt>
                        <dd class="col-sm-8" th:text="${isActive} ? 'Yes' : 'No'">Yes</dd>
                    </dl>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
