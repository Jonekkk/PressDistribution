<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <nav th:replace="~{fragments/nav :: nav}"></nav>

        <h2>Change Password</h2>

        <div th:if="${currentPasswordError}" class="alert alert-danger" th:text="${currentPasswordError}"></div>
        <div th:if="${globalError}" class="alert alert-danger" th:text="${globalError}"></div>

        <div class="row">
            <div class="col-md-6">
                <form th:object="${passwordChangeForm}" method="post" th:action="@{/profile/password}">

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Current password *</label>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New password *</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm new password *</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                        <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger small"></span>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
