<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div th:if="${successMessage}" class="alert alert-success" role="alert">
                    <span th:text="${successMessage}">Success</span>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title mb-4">My Profile</h3>

                        <dl class="row mb-0">
                            <dt class="col-sm-4">Full name</dt>
                            <dd class="col-sm-8" th:text="${profile.fullName()}">John Doe</dd>

                            <dt class="col-sm-4">Email</dt>
                            <dd class="col-sm-8" th:text="${profile.email()}">john@example.com</dd>

                            <dt class="col-sm-4">Phone number</dt>
                            <dd class="col-sm-8"
                                th:text="${profile.phoneNumber() != null and !profile.phoneNumber().isBlank()} ? ${profile.phoneNumber()} : '—'">—</dd>

                            <dt class="col-sm-4">Role</dt>
                            <dd class="col-sm-8" th:text="${profile.roleName()}">Administrator</dd>

                            <dt class="col-sm-4" th:if="${profile.parishDisplay() != null}">Parish</dt>
                            <dd class="col-sm-8" th:if="${profile.parishDisplay() != null}"
                                th:text="${profile.parishDisplay()}">Parish Name</dd>
                        </dl>
                    </div>
                </div>

                <div class="mt-3">
                    <a th:href="@{/profile/edit}" class="btn btn-primary">Edit profile</a>
                    <a th:href="@{/profile/password}" class="btn btn-outline-secondary">Change password</a>
                    <a th:href="@{/profile/recovery-code-reset}" class="btn btn-outline-secondary">Generate new recovery code</a>
                </div>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
