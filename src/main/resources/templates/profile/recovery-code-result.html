<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recovery Code - Press Distribution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="alert alert-warning" role="alert">
                    <strong>Important:</strong> Save this recovery code now. It will not be shown again.
                </div>

                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Your New Recovery Code</h5>
                        <p class="card-text fs-4 font-monospace" th:text="${recoveryCode}">XXXX-XXXX-XXXX-XXXX</p>
                    </div>
                </div>

                <div class="mt-3">
                    <a th:href="@{/profile}" class="btn btn-primary">Back to profile</a>
                </div>
            </div>
        </div>
    </div>
<script th:replace="~{fragments/scripts :: bootstrap-js}"></script>
</body>
</html>
